# OpenRemote v3
#
# Profile for doing IDE development work and running build tests.
#
# Please see profile/deploy.yml for configuration details for each service.
#
volumes:
  postgresql-data:
  superset-data:
services:

  keycloak:
    extends:
      file: deploy.yml
      service: keycloak
    # volumes:
    #   Map custom themes
    #  - ../deployment:/deployment
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8080}
      KC_LOG_CONSOLE_FORMAT: '%-5p [%c] (%t) %s%e%n'
      # Prevent theme caching during dev
      KEYCLOAK_START_OPTS: --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false

  postgresql:
    extends:
      file: deploy.yml
      service: postgresql
    volumes:
      - ../tmp:/storage
      - postgresql-data:/var/lib/postgresql/data
      - ../superset/init-superset-db.sql:/docker-entrypoint-initdb.d/init-superset-db.sql
    # Access directly if needed on localhost
    ports:
      - "5432:5432"
  superset:
    build: ../superset
    environment:
      SUPERSET_DATABASE_URI: "postgresql://superset:superset@postgresql:5432/superset"
      SECRET_KEY: "your-secret-key-change-me"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/app/superset_home
